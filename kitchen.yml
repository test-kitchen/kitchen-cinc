---
driver:
  name: vagrant

provisioner:
  name: cinc_infra
  product_name: cinc
  product_version: latest
  channel: stable
  deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: ubuntu-24.04
  - name: almalinux-9

suites:
  - name: default
    run_list:
      - recipe[test_cookbook::default]
    verifier:
      inspec_tests:
        - test/integration/default
